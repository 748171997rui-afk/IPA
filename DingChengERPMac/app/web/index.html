<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鼎城 ERP · 库存 / 出入库查询</title>
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="鼎城ERP">
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --line:rgba(60,60,67,.14); --text:#1C1C1E; --muted:#6D6D72;
    --accent:#007AFF; --accent-soft:rgba(0,122,255,.10); --up:#D70015; --down:#248A3D;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box}
  button,input,select{font-family:inherit}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 18px 30px}
  .wrap.compact{max-width:800px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.1px}
  .sub{color:var(--muted);font-size:13px}
  .badge{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:6px 13px;font-size:12px;color:var(--muted);box-shadow:var(--shadow)}
  .dot{width:7px;height:7px;border-radius:50%;background:#FF9500}
  .dot.ok{background:#34C759}.dot.err{background:#FF3B30}
  .link{color:var(--accent);text-decoration:none;font-size:12px;font-weight:500;border:1px solid var(--line);
    background:var(--card);padding:6px 13px;border-radius:999px;box-shadow:var(--shadow);
    transition:background .15s}
  .link:hover{background:var(--accent-soft)}
  .card{background:var(--card);border:1px solid rgba(60,60,67,.10);border-radius:14px;box-shadow:var(--shadow)}
  /* iOS 分段控件（Segmented Control）：灰底轨道 + 白色浮起选中段 */
  .tabs{display:flex;gap:2px;padding:3px;margin-bottom:12px;border:0;box-shadow:none;
    background:rgba(120,120,128,.12);border-radius:12px}
  .tab{border:0;background:transparent;padding:8px 20px;border-radius:9px;cursor:pointer;
    font-size:14px;color:var(--text);font-weight:500;transition:background .18s,color .18s}
  .tab:hover{background:rgba(120,120,128,.10);color:var(--text)}
  .tab.active{background:var(--card);color:var(--text);font-weight:600;
    box-shadow:0 1px 4px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.04)}
  .filters{padding:14px 16px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  input,select{width:100%;height:34px;padding:0 10px;border:1px solid rgba(60,60,67,.18);border-radius:10px;background:#fff;
    color:var(--text);font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3.5px rgba(0,122,255,.13)}
  .actions{display:flex;gap:9px;align-items:flex-end;padding-top:18px;flex-wrap:wrap;grid-column:span 2}
  button.btn{height:34px;padding:0 17px;border:0;border-radius:10px;background:rgba(120,120,128,.10);
    color:var(--accent);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;
    transition:background .15s,transform .1s}
  button.btn:hover{background:rgba(120,120,128,.16)}
  button.btn:active{transform:scale(.97)}
  button.primary{background:var(--accent);color:#fff;font-weight:600}
  button.primary:hover{background:#0077ED}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
  .stat{padding:11px 14px;text-align:center}
  .stat .k{font-size:12px;color:var(--muted);margin-bottom:6px}
  .stat .v{font-size:21px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
  .tablebox{overflow:auto;max-height:calc(100vh - 330px);border-radius:12px}
  /* 库存汇总：固定列宽，表格始终与容器同宽，任何窗口宽度都不出现横向滚动条 */
  .wrap.compact .tablebox{overflow-x:hidden;overflow-y:auto}
  .wrap.compact table{table-layout:fixed}
  .wrap.compact th,.wrap.compact td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap.compact td[data-key="mingcheng"],.wrap.compact td[data-key="leixing"]{
    white-space:normal;word-break:break-word;overflow-wrap:anywhere;text-overflow:clip}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;white-space:nowrap}
  th{position:sticky;top:0;z-index:2;background:#F6F6F8;color:var(--muted);font-weight:600;font-size:11.5px;
    letter-spacing:.3px;text-align:center;padding:8px 10px;border-bottom:.5px solid rgba(60,60,67,.18)}
  td{padding:7px 10px;border-bottom:.5px solid rgba(60,60,67,.12);color:#3A3A3C;
    font-variant-numeric:tabular-nums;text-align:center}
  tbody tr:hover td{background:rgba(0,122,255,.06)}
  /* 库存少于 50 的行高亮：1~49 黄色，0 及以下红色 */
  tbody tr.stock-low td{background:#fff8e6}
  tbody tr.stock-low:hover td{background:#ffefc7}
  tbody tr.stock-low td:first-child{box-shadow:inset 3px 0 0 #FF9500}
  tbody tr.stock-empty td{background:#fef2f2}
  tbody tr.stock-empty:hover td{background:#fee2e2}
  tbody tr.stock-empty td:first-child{box-shadow:inset 3px 0 0 #FF3B30}
  .stock-qty-low{font-weight:700;color:#C25E00}
  .stock-qty-empty{font-weight:700;color:#D70015}
  td.num{text-align:center}
  .legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .legend span{white-space:nowrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .chk{display:flex;align-items:center;gap:5px;margin:0;white-space:nowrap;cursor:pointer;color:var(--text)}
  .chk input{width:14px;height:14px;margin:0;padding:0;flex:none;accent-color:var(--accent)}
  .neg{color:var(--down)}.pos{color:var(--up)}
  .foot{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .foot .sp{margin-left:auto}
  .foot button{padding:5px 13px;border:0;background:rgba(120,120,128,.10);border-radius:8px;cursor:pointer;
    color:var(--accent);font-weight:500;transition:background .15s}
  .foot button:hover:not(:disabled){background:rgba(120,120,128,.16)}
  .foot button:disabled{opacity:.4;cursor:default}
  .note{padding:10px 16px;font-size:12px;color:#8A6D1F;background:#FFFBEA;border:1px solid rgba(245,158,11,.35);
    border-radius:12px;margin-bottom:12px;display:none}
  .note.show{display:block}
  .empty{padding:48px;text-align:center;color:var(--muted)}
  .loading{opacity:.55;pointer-events:none}
  .filter-toggle{display:none}
  /* ===== 手机端：表格转卡片列表（窄屏自动生效，/m.html 强制生效） ===== */
  .mobile-mode .wrap{max-width:520px;padding:10px 10px 24px}
  .mobile-mode header{gap:8px;margin-bottom:10px}
  .mobile-mode h1{font-size:16px}
  .mobile-mode .sub{font-size:11.5px}
  .mobile-mode .badge{margin-left:0;padding:5px 10px;font-size:11px}
  .mobile-mode .link{padding:5px 9px;font-size:11px}
  .mobile-mode .tabs{overflow-x:auto;padding:4px;margin-bottom:10px}
  .mobile-mode .tab{padding:8px 13px;font-size:13px;flex:none}
  .mobile-mode .filters{padding:10px;margin-bottom:10px}
  .mobile-mode .filter-toggle{display:block;width:100%;height:32px;text-align:left;font-weight:600}
  .mobile-mode .filters:not(.open) .grid{display:none}
  .mobile-mode .filters.open .filter-toggle{margin-bottom:10px}
  .mobile-mode .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .mobile-mode .actions{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding-top:0}
  .mobile-mode .actions .btn{width:100%;padding:0 6px;flex:none}
  .mobile-mode .stats{display:flex;overflow-x:auto;gap:8px;padding-bottom:4px;margin-bottom:10px}
  .mobile-mode .stat{flex:0 0 118px;min-width:118px;padding:8px 10px}
  .mobile-mode .stat .k{font-size:11px}
  .mobile-mode .stat .v{font-size:16px}
  .mobile-mode .note.show{font-size:11.5px;padding:8px 10px;margin-bottom:10px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  .mobile-mode .note.show.open{display:block;cursor:default}
  .mobile-mode .tablebox{max-height:none;overflow:visible;background:transparent;border:0;box-shadow:none;border-radius:0}
  /* 手机端用独立卡片列表，不把 td 转成卡片（表格单元格跨浏览器渲染不稳定） */
  #cardWrap{display:none}
  .mobile-mode #tableWrap{display:none}
  .mobile-mode #cardWrap{display:block}
  .mcard{background:var(--card);border:1px solid rgba(60,60,67,.10);border-radius:14px;
    padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
  .mcard.low{background:#FFF9E8;border-color:rgba(255,149,0,.35)}
  .mcard.emptyq{background:#FEF1F1;border-color:rgba(255,59,48,.30)}
  .mcard .top{display:flex;justify-content:center;align-items:baseline;gap:10px}
  .mcard .spec{font-size:15px;font-weight:700;letter-spacing:-.2px;color:var(--text);word-break:break-all;text-align:center}
  .mobile-mode .mcard .spec .slabel{font-size:11px;font-weight:500;color:var(--muted);margin-right:6px}
  .mobile-mode .mcard.flow .meta span{white-space:normal;word-break:break-all}
  .mcard .mq{font-size:14px;font-weight:700;color:var(--accent)}
  .mcard.low .mq{color:#C25E00}
  .mcard.emptyq .mq{color:#D70015}
  .mcard .meta{margin-top:5px;font-size:11.5px;color:var(--muted);line-height:1.7;word-break:break-all;
    text-align:center;display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:1px 9px}
  .mcard .meta b{color:#3A3A3C;font-weight:500}
  .mcard .meta span{white-space:nowrap}
  .mobile-mode .foot{flex-wrap:wrap;gap:8px;padding:10px;margin-top:10px}
  .mobile-mode .foot .sp{display:none}
  .mobile-mode .legend{gap:10px;font-size:11px}
  @media(max-width:700px){.wrap{padding:10px}.tablebox{max-height:none}}
  /* ===== 登录遮罩：所有文字与输入居中，手机端不出现横向滚动条 ===== */
  /* 微信 X5 等老内核不认 inset 简写，显式写四边，避免键盘弹起时遮罩错位挡住输入框 */
  .overlay{position:fixed;top:0;left:0;right:0;bottom:0;inset:0;z-index:50;display:flex;
    align-items:center;justify-content:center;background:rgba(28,28,30,.44);padding:16px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .overlay[hidden]{display:none}
  .login-card{width:100%;max-width:340px;background:var(--card);border:1px solid rgba(60,60,67,.10);
    border-radius:18px;box-shadow:0 18px 48px rgba(0,0,0,.30);padding:24px 22px 20px}
  .login-title{font-size:17px;font-weight:650;text-align:center;margin-bottom:6px}
  .login-company{font-size:12.5px;color:var(--text);text-align:center;margin-bottom:18px;
    padding:8px 8px;background:rgba(120,120,128,.10);border:1px solid rgba(60,60,67,.10);border-radius:10px;word-break:break-all}
  .login-card label{text-align:center}
  /* 只给文本输入加样式：appearance:none 曾把「记住密码」复选框一起自绘成空白，
     在微信 X5 / 安卓 WebView 里既看不见也点不动；原生渲染对输入法兼容性也更好。 */
  .login-card input:not([type="checkbox"]){text-align:center;height:38px;font-size:14px;margin-bottom:12px;
    border-radius:10px;-webkit-user-select:text;user-select:text}
  .login-card input::placeholder{text-align:center;color:#9ca3af}
  /* 密码框故意保持 type=text：微信 X5 只要检测到 type=password 就把整张表单识别成
     「账号密码登录表单」并强制英文安全键盘，第三方中文输入法切不出来。改用圆点遮蔽。 */
  #loginPass{-webkit-text-security:disc}
  .login-err{text-align:center;color:#D70015;font-size:12.5px;min-height:18px;margin:2px 0 0}
  .login-err[hidden]{display:none}
  .login-btn{width:100%;height:38px;margin-top:10px;font-size:14px;text-align:center}
  .login-btn:disabled{opacity:.6;cursor:default}
  .login-remember{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--text);margin-top:2px;cursor:pointer;user-select:none;touch-action:manipulation}
  .login-remember input{width:17px;height:17px;margin:0;accent-color:var(--accent);flex:none;
    -webkit-appearance:checkbox;appearance:checkbox;pointer-events:auto;cursor:pointer}
  .login-remember span{cursor:pointer}
  .login-tip{text-align:center;color:var(--muted);font-size:11px;margin-top:12px}
  #btnLogout{cursor:pointer;font-family:inherit}
  .mobile-mode .overlay{padding:12px;align-items:flex-start;padding-top:12vh}
  .mobile-mode .login-card{max-width:100%;padding:18px 16px 14px}
  /* ===== 进销动态：文字报告（按仓库叙述出入库，全部铺开，无横竖滚动条） ===== */
  .filters.jx .f-extra{display:none}
  /* 进销动态模式：内容区不再限高/内滚，报告随页面自然铺开 */
  .wrap.jxmode .tablebox{max-height:none;overflow:visible}
  #jxWrap{display:none}
  #jxWrap.show{display:block}
  .jx-report{padding:16px 18px 18px;line-height:1.9;font-size:13.5px;color:#3A3A3C}
  .jx-range{font-weight:600;color:var(--text);font-size:14px;padding-bottom:6px;
    border-bottom:.5px solid rgba(60,60,67,.18);margin-bottom:8px}
  .jx-sec{margin:12px 0 4px;font-weight:600;color:var(--accent);font-size:13px}
  .jx-item{padding:1px 0}
  .jx-item b{color:var(--text)}
  .jx-item.muted{color:var(--muted)}
  .mobile-mode .jx-report{padding:12px 14px 14px;font-size:13px;line-height:1.8}
  .mobile-mode .jx-item{word-break:break-all}

/* ===== 鼎城 ERP 桌面版 · 原生外壳皮肤（Cloud Deck / 云工作台） =====
   参考「工作台 UI 设计」：淡蓝紫光晕底、白色浮动胶囊导航、大圆角白卡、
   亮蓝主按钮、深色胶囊选中态、极淡阴影与清晰字重层级。
   只覆盖视觉变量、配色、圆角与阴影；所有几何尺寸（容器宽度、页签/筛选/表格
   高度、四个页签等比例、一屏无滚动）保持上一版完全不变。
   此文件仅注入到桌面版独立目录的网页副本，网页版 / 安卓 / iOS / 旧 EXE 均不受影响。 */
:root{
  --bg:#f3f5fd; --card:#fff; --line:#e5eaf6; --text:#1b2440; --muted:#8b96b3;
  --accent:#2f6bff; --accent-soft:#eef3ff;
  --shadow:0 3px 14px rgba(38,54,110,.055),0 1px 2px rgba(38,54,110,.035);
  --ink:#1b2440; --ink-2:#3d4a6b; --faint:#b3bdd6; --line-2:#f1f4fc;
  --brand:#2f6bff; --brand-hi:#2460ef; --deep:#232c4c;
}
body{padding-top:44px!important;padding-bottom:30px!important;
  background:radial-gradient(900px 520px at 6% -12%,rgba(123,151,255,.20),transparent 62%),
             radial-gradient(760px 520px at 102% 104%,rgba(168,142,255,.16),transparent 62%),
             linear-gradient(180deg,#f6f8ff 0%,#eef1fb 100%);
  color:var(--ink);
  font-family:"Segoe UI","Microsoft YaHei UI","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* ---- 自定义窗口标题栏：白色浮动胶囊，呼应参考图的顶部导航 ---- */
#dcTitleBar{position:fixed;top:0;left:0;right:0;height:44px;z-index:2147483000;
  display:flex;align-items:center;padding-left:26px;color:#23304f;
  background:transparent;border-bottom:0;
  -webkit-app-region:drag;user-select:none;box-shadow:none}
#dcTitleBar::before{content:'';position:absolute;inset:5px 12px 4px;z-index:-1;
  background:linear-gradient(180deg,#fff,#fbfcff);
  border:1px solid rgba(223,230,247,.95);border-radius:14px;
  box-shadow:0 2px 10px rgba(40,60,120,.07),0 1px 2px rgba(40,60,120,.04)}
.dc-mark{width:24px;height:24px;border-radius:7px;
  background:linear-gradient(145deg,#4b87ff,#2f63ee);
  border:1px solid rgba(255,255,255,.34);color:#fff;font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;flex:none;
  box-shadow:0 2px 6px rgba(47,99,238,.26);letter-spacing:0}
.dc-name{font-size:13px;font-weight:650;letter-spacing:.3px;margin-left:11px;white-space:nowrap;color:#1b2440}
/* 参考图 logo 上的橙色小标，作为整套冷色里的一点暖色点缀 */
.dc-name::after{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;
  background:#ff914d;margin-left:6px;vertical-align:2px}
.dc-sep{width:1px;height:13px;background:#dfe5f5;margin:0 14px;flex:none}
.dc-sub{font-size:11.5px;color:#909bb8;white-space:nowrap;letter-spacing:.3px}
.dc-drag{flex:1;height:100%;min-width:20px}
.dc-status{display:flex;align-items:center;gap:8px;font-size:11px;color:#8893b1;
  background:transparent;border:0;border-radius:0;margin-right:18px;padding:0;
  white-space:nowrap;-webkit-app-region:no-drag;letter-spacing:.2px}
.dc-dot{width:5px;height:5px;border-radius:50%;background:#3b7bff;
  box-shadow:0 0 0 3px rgba(59,123,255,.12);flex:none}
.dc-btn{width:42px;height:44px;border:0;background:transparent;color:#8792b1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  -webkit-app-region:no-drag;transition:background .16s,color .16s;flex:none}
.dc-btn:hover{background:rgba(47,107,255,.08);color:#2f63ee}
.dc-btn:active{background:rgba(47,107,255,.13)}
.dc-btn.dc-close:hover{background:#e25454;color:#fff}
.dc-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.35;fill:none;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

/* ---- macOS：标题栏交给系统原生红黄绿按钮（hiddenInset + trafficLightPosition） ---- */
html.is-mac #dcTitleBar{padding-left:86px}
html.is-mac #dcMinBtn,
html.is-mac #dcMaxBtn,
html.is-mac #dcCloseBtn{display:none}
html.is-mac #dcTitleBar::before{inset:5px 12px 4px}

/* ---- 底部状态栏：淡蓝白 + 极细分隔线 ---- */
#dcStatusBar{position:fixed;left:0;right:0;bottom:0;height:30px;z-index:2147483000;
  display:flex;align-items:center;gap:18px;padding:0 20px;
  background:rgba(249,251,255,.96);border-top:1px solid #e5eaf6;color:#8b96b3;
  font-size:11px;letter-spacing:.2px;user-select:none;white-space:nowrap;overflow:hidden}
#dcStatusBar b{font-weight:600;color:#3d4a6b;font-variant-numeric:tabular-nums}
#dcStatusBar .dc-sdot{display:inline-block;width:5px;height:5px;border-radius:50%;
  background:#3b7bff;margin-right:7px;vertical-align:1px}
#dcStatusBar #dcSync{min-width:0;overflow:hidden;text-overflow:ellipsis}
#dcStatusBar #dcSync.busy{color:var(--brand);font-weight:500}
#dcStatusBar .dc-right{margin-left:auto;color:#aab4cf}

/* ---- 内容区：三个页签共用同一套紧凑尺寸，省出的高度全部留给表格 ---- */
.wrap{max-width:1240px;padding:12px 24px 8px}
/* 网页端给库存汇总单独限宽 800px，切页签时整块内容会突然缩窄；
   桌面版统一成与出入库记录相同的容器宽度。带 :not(.mobile-mode) 前缀，
   避免覆盖手机端 520px 布局；库存表格的固定列宽/单行省略规则保持不变。 */
body:not(.mobile-mode) .wrap.compact{max-width:1240px}
.wrap > header{justify-content:flex-end;gap:8px;margin-bottom:8px}
.wrap > header > div:first-child{display:none}   /* 程序名/公司名已由标题栏承载，功能控件全部保留 */
.wrap > header .badge{margin-left:0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

/* 右上角：参考图的白色小胶囊 */
.badge{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);
  padding:3px 11px;border-radius:999px;font-size:12px;color:#7a87a8;gap:8px}
.badge .dot{width:6px;height:6px;background:#f0ad3e}
.badge .dot.ok{background:#2f9d72}
.badge .dot.err{background:#dc5c5c}
.link{color:#5c6b96;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);
  padding:5px 12px;border-radius:999px;font-size:12px;font-weight:500;cursor:pointer;
  text-decoration:none;letter-spacing:.2px;transition:background .15s,color .15s}
.link:hover{background:#eef3ff;border-color:#d7e0fa;color:var(--brand)}

/* ---- 页签：白色胶囊导航 + 深色胶囊选中态（取代网页 pill 与上一版下划线） ---- */
.tabs{height:35px;box-sizing:border-box;padding:3px 4px;gap:2px;align-items:center;
  background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);
  margin-bottom:8px}
.tab{position:relative;height:27px;box-sizing:border-box;line-height:27px;padding:0 20px;
  border-radius:999px;border:0;background:transparent;
  font-size:13px;color:#8b96b3;font-weight:500;letter-spacing:.2px;
  cursor:pointer;transition:color .15s,background .15s}
.tab:hover{background:#f2f5ff;color:#243152}
.tab.active{background:var(--deep);color:#fff;font-weight:600;
  box-shadow:0 2px 6px rgba(35,44,76,.18)}
.tab.active::after{content:none}   /* 去掉上一版的 2px 下划线 */

/* ---- 筛选与表单：四个页签统一压紧，按钮与输入框同行贴底 ---- */
.filters{padding:10px 16px;margin-bottom:8px}
.grid{grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:8px}
label{font-size:11px;color:var(--muted);letter-spacing:.4px;margin-bottom:3px;font-weight:500}
input,select{height:30px;border-radius:8px;border:1px solid #e2e8f6;background:#fff;
  color:var(--ink);font-size:12.5px;padding:0 10px;
  box-shadow:inset 0 1px 1px rgba(35,55,110,.015);transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#b7c0d8}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,107,255,.12);outline:none}
.actions{padding-top:0}
button.btn{height:30px;padding:0 16px;border-radius:8px;border:1px solid #e2e8f6;
  background:#fff;color:var(--ink-2);font-size:13px;font-weight:500;letter-spacing:.2px;
  cursor:pointer;transition:background .15s,border-color .15s,color .15s}
button.btn:hover{border-color:#ccd8f5;background:#f6f8ff;color:var(--ink)}
button.primary{background:linear-gradient(180deg,#3d7bff,#2f63ee);border-color:#2f63ee;color:#fff;
  box-shadow:0 3px 10px rgba(47,99,238,.22)}
button.primary:hover{background:linear-gradient(180deg,#3471f5,#2559df);
  border-color:#2559df;color:#fff}
button.primary:active{background:#2559df;border-color:#2559df}

/* ---- 统计卡片：小标签 + 等宽大数字，右上角极淡 ↗，顶部一道渐隐细线 ---- */
.stats{gap:10px;margin-bottom:8px}
.stat{padding:9px 14px 10px;text-align:center;position:relative;overflow:hidden;border-radius:14px}
.stat::before{content:'';position:absolute;top:0;left:18%;right:18%;height:1px;
  background:linear-gradient(90deg,transparent,#c9d8ff,transparent)}
.stat::after{content:'↗';position:absolute;right:13px;top:8px;
  font-size:12px;color:#c6cfe8;font-weight:400;line-height:1}
.stat .k{font-size:11px;color:#8792b0;letter-spacing:.6px;margin-bottom:4px;font-weight:500}
/* 参考图的小彩色徽标：只用一个 6px 低饱和圆点，不做图标堆砌 */
.stat .k::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:#7fa4ff;margin-right:7px;vertical-align:1px}
.stats .stat:nth-child(2) .k::before{background:#57b894}
.stats .stat:nth-child(3) .k::before{background:#f0ae62}
.stats .stat:nth-child(4) .k::before{background:#9b8ae0}
.stats .stat:nth-child(5) .k::before{background:#e08585}
.stat .v{font-size:22px;font-weight:650;letter-spacing:-.8px;color:#1b2440;
  font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}

/* ---- 表格：细线、舒展行高、低饱和高亮、定制滚动条 ---- */
.tablebox{background:#fff;border-radius:14px}
table{font-size:12.5px}
th{background:#f7f9ff;color:#8792b0;font-size:11px;font-weight:600;letter-spacing:.5px;
  text-align:center;padding:10px 12px;border-bottom:1px solid #e9edf8}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);color:#36436a;font-size:12.5px;
  text-align:center;font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
tbody tr:nth-child(even) td{background:#fafbff}
tbody tr:hover td{background:#eef4ff}
tbody tr.stock-low td{background:#fff8ec}
tbody tr.stock-low:hover td{background:#fff1d8}
tbody tr.stock-low td:first-child{box-shadow:inset 2px 0 0 #eeb24a}
tbody tr.stock-empty td{background:#fff2f2}
tbody tr.stock-empty:hover td{background:#fee7e7}
tbody tr.stock-empty td:first-child{box-shadow:inset 2px 0 0 #dd5f5f}
.stock-qty-low{font-weight:600;color:#a8761f}
.stock-qty-empty{font-weight:600;color:#b34a3f}
.tablebox::-webkit-scrollbar{width:9px;height:9px}
.tablebox::-webkit-scrollbar-track{background:transparent}
.tablebox::-webkit-scrollbar-thumb{background:#d6ddf1;border:2px solid #fff;border-radius:9px}
.tablebox::-webkit-scrollbar-thumb:hover{background:#bcc8e8}

/* ---- 分页栏 / 提示条 ---- */
.foot{padding:7px 14px;font-size:11.5px;color:#8792b0;gap:10px}
/* HTML 上写了 inline margin-top:12px，这里用 id + important 统一压到 8px */
#foot{margin-top:8px!important}
.foot button{padding:5px 12px;border:1px solid #e2e8f6;background:#fff;border-radius:8px;
  cursor:pointer;color:var(--ink-2);font-size:12px;transition:background .15s,border-color .15s}
.foot button:hover:not(:disabled){border-color:#ccd8f5;background:#f6f8ff}
.foot button:disabled{opacity:.35;cursor:default}
.foot select{border-color:#e2e8f6;border-radius:8px;color:var(--ink-2)}
.foot .legend{color:var(--muted)}
.note{background:#f6f9ff;border:1px solid #dbe4f8;border-radius:10px;color:#5a6a94;
  box-shadow:0 1px 3px rgba(40,70,150,.035)}
/* 统计说明条（库存汇总 / 进销动态都有）：压紧上下留白与行高，固定两行高度，
   这样窗口变窄换行时也不会把上半部分撑高，三个表格页始终等高；点一下可看全文。 */
body:not(.mobile-mode) .note.show{padding:5px 13px;font-size:11.5px;line-height:1.4;margin-bottom:8px;
  background:#f6f9ff;border:1px solid #dbe4f8;
  max-height:47px;overflow:hidden;cursor:pointer}
body:not(.mobile-mode) .note.show.open{max-height:none;overflow:visible;cursor:default}
.empty{color:var(--faint)}
.jx-sec{color:var(--brand)}
.jx-range{color:var(--ink);border-bottom-color:var(--line)}
.jx-item b{color:var(--ink)}
.jx-item.muted{color:var(--muted)}

/* ---- 登录遮罩：深蓝紫渐变（呼应参考图的深蓝海报底）+ 白卡 ---- */
.overlay{top:44px!important;bottom:30px!important;
  background:radial-gradient(820px 560px at 50% 34%,rgba(46,80,196,.60),rgba(9,16,42,.93))!important;
  backdrop-filter:blur(5px)}
.login-card{border-radius:16px;padding:30px 26px 22px;
  background:#fff;border:1px solid #e6ebf8;
  box-shadow:0 28px 68px rgba(8,18,55,.38)}
.login-title{font-size:18px;font-weight:650;letter-spacing:-.2px;color:var(--ink);margin-bottom:8px}
.login-company{background:#f4f7ff;border-color:#e5eaf8;color:#4a5b86;
  border-radius:9px;font-size:12px;letter-spacing:.2px;margin-bottom:20px}
.login-card label{font-size:11.5px;letter-spacing:.4px;color:var(--muted)}
.login-card input:not([type="checkbox"]){height:40px;border-radius:9px;border-color:#e2e8f6}
.login-card input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,107,255,.12)}
.login-btn{height:40px;font-weight:600;letter-spacing:2px;
  background:linear-gradient(180deg,#3d7bff,#2f63ee);border-color:#2f63ee}
.login-btn:hover{background:linear-gradient(180deg,#3471f5,#2559df)!important;
  border-color:#2559df!important}
.login-tip{color:#a9b3cd;font-size:11px}
.login-remember{color:var(--ink-2)}

/* ---- 一屏布局：上半部分压紧后，把省出的高度全部还给表格区 ---- */
/* 入库 / 出库 / 库存汇总三个页签共用同一个表格高度：库存页多出的说明条由
   --dc-note-slot 统一预留（流水页同样扣掉、底部留一点白），三页比例完全一致。
   shell.js 按窗口宽度动态更新该值，说明文字换行时表格自动让位。 */
.tablebox{max-height:calc(100vh - 435px - var(--dc-note-slot, 42px))!important;min-height:180px}
/* 流水页原本 11 列固定最小宽度会撑出横向滚动条、把「来源/备注」裁掉；
   桌面版改为自适应列宽 + 长文本换行，信息完整且无横向滚动（库存汇总仍是紧凑单行） */
.wrap:not(.compact) .tablebox{overflow-x:hidden}
.wrap:not(.compact) .tablebox table{width:100%!important}
.wrap:not(.compact) .tablebox th{min-width:0!important}
.wrap:not(.compact) .tablebox th,
.wrap:not(.compact) .tablebox td{white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.wrap:not(.compact) .tablebox th:first-child,
.wrap:not(.compact) .tablebox td:first-child{white-space:nowrap}
.wrap.jxmode .tablebox,.mobile-mode .tablebox{max-height:none!important}

</style>
</head>
<body>
<div id="dcTitleBar">
  <div class="dc-mark">鼎</div>
  <div class="dc-name">鼎城 ERP</div>
  <div class="dc-sep"></div>
  <div class="dc-sub">库存 / 出入库查询</div>
  <div class="dc-drag" id="dcDrag"></div>
  <div class="dc-status"><span class="dc-dot"></span><span id="dcStatusText">正在启动服务…</span></div>
  <button class="dc-btn" id="dcMenuBtn" title="菜单" type="button">
    <svg viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
  </button>
  <button class="dc-btn" id="dcMinBtn" title="最小化" type="button">
    <svg viewBox="0 0 16 16"><path d="M2.5 8h11"/></svg>
  </button>
  <button class="dc-btn" id="dcMaxBtn" title="最大化" type="button">
    <svg viewBox="0 0 16 16"><rect id="dcMaxRect" x="3.5" y="3.5" width="9" height="9" rx="1.2"/></svg>
  </button>
  <button class="dc-btn dc-close" id="dcCloseBtn" title="关闭（同时停止后台服务）" type="button">
    <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
  </button>
</div>
<div id="dcStatusBar">
  <span><span class="dc-sdot"></span>本机服务 127.0.0.1:<b id="dcPort">—</b></span>
  <span id="dcSync">正在连接本地数据…</span>
  <span class="dc-right">鼎城 ERP 桌面版 · v<span id="dcVer">—</span> · 只读查询</span>
</div>

<div class="wrap">
  <header>
    <div>
      <h1>ERP 库存 / 出入库查询</h1>
      <div class="sub" id="company">—</div>
    </div>
    <div class="badge"><span class="dot" id="dot"></span><span id="loginMsg">连接中…</span></div>
    <a class="link" id="official" href="#" target="_blank" rel="noopener">官方实时库存 ↗</a>
    <button class="link" id="btnLogout" type="button" hidden>退出登录 / 切换账号</button>
  </header>

  <div class="card tabs" id="tabs">
    <button class="tab active" data-t="ruku">入库记录</button>
    <button class="tab" data-t="chuku">出库记录</button>
    <button class="tab" data-t="stock">库存汇总</button>
    <button class="tab" data-t="jinxiao" id="tabJinxiao">进销动态</button>
  </div>

  <div class="card filters" id="filters">
    <button class="btn filter-toggle" id="filterToggle" type="button">筛选条件 ⌄</button>
    <div class="grid">
      <div><label>开始日期</label><input type="date" id="start"></div>
      <div><label>结束日期</label><input type="date" id="end"></div>
      <div class="f-extra"><label>关键字 / 规格</label><input id="q" placeholder="如：400X2600、400*2600 或 2600"></div>
      <div class="f-extra"><label>仓库</label><input id="cangku" placeholder="库位 / 仓库"></div>
      <div class="f-extra"><label>类型</label><select id="leixing"><option value="">全部类型</option></select></div>
      <div class="f-extra"><label>项目</label><input id="xmmc" placeholder="项目名称"></div>
      <div class="actions">
        <button class="btn primary" id="btnSearch">查询</button>
        <button class="btn" id="btnAllTime" title="清空日期，统计全部历史记录">全部时间</button>
        <button class="btn" id="btnReset">重置</button>
        <button class="btn" id="btnExport">导出 CSV</button>
      </div>
    </div>
  </div>

  <div class="note" id="note"></div>

  <div class="stats" id="stats"></div>

  <div class="card tablebox" id="tablebox">
    <div id="tableWrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div id="jxWrap"></div>
    <div id="cardWrap"></div>
    <div class="empty" id="empty" style="display:none">没有符合条件的记录</div>
  </div>
  <div class="card foot" id="foot" style="margin-top:12px">
    <span id="pageInfo">—</span>
    <span id="syncInfo" style="color:var(--muted);font-size:11px"></span>
    <label class="chk" id="lowWrap" style="display:none"><input type="checkbox" id="onlyLow"> 只看低库存 &lt;50</label>
    <span class="legend" id="legend" style="display:none">
      <span><i style="background:#FFF9E8;border:1px solid #FF9500"></i>库存 1–49</span>
      <span><i style="background:#FEF1F1;border:1px solid #FF3B30"></i>库存 ≤0（无库存/异常）</span>
    </span>
    <select id="pageSize" style="width:88px;height:28px;font-size:12px">
      <option value="20">20 条/页</option><option value="50">50 条/页</option>
      <option value="100">100 条/页</option><option value="200">200 条/页</option>
    </select>
    <span class="sp"></span>
    <button id="prev">上一页</button><button id="next">下一页</button>
  </div>
</div>

<div class="overlay" id="loginOverlay" hidden>
  <div class="login-card">
    <div class="login-title">ERP 库存 / 出入库查询</div>
    <div class="login-company" id="loginCompany">江西鼎城铝模科技有限公司</div>
    <label for="loginUser">账号</label>
    <!-- 微信 X5 只要看到 type=password / autocomplete=username|current-password，
         就把整页判定为「账号密码登录表单」，强制英文安全键盘、第三方中文输入法切不出来。
         因此两个框都用普通 type=text，不带 name，密码仅用 CSS 圆点遮蔽。 -->
    <input id="loginUser" type="text" inputmode="text" enterkeyhint="done"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="请输入账号（支持中文）">
    <label for="loginPass">密码</label>
    <input id="loginPass" type="text" inputmode="text" enterkeyhint="done"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           data-dc-secret="1" placeholder="请输入密码">
    <div class="login-remember" id="rememberRow"><input type="checkbox" id="rememberChk" checked><span>记住密码，下次自动登录</span></div>
    <div class="login-err" id="loginErr" hidden></div>
    <button class="btn primary login-btn" id="btnLogin" type="button">登 录</button>
    <div class="login-tip">勾选后凭据只保存在本机用于自动登录，退出登录会清除</div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const S = { tab:'ruku', page:1, rows:20, total:0, columns:[], data:[], view:[], meta:null, busy:false, dateTouched:false };

// 统一请求：携带同源会话 cookie；会话失效时重新显示登录框
async function api(url, opt = {}) {
  let r;
  try {
    r = await fetch(url, { credentials:'same-origin', ...opt });
  } catch (e) {
    // 连接失败：自动重试一次（瞬时抖动/刷新中断），仍失败则给出明确提示
    await new Promise(s => setTimeout(s, 600));
    try {
      r = await fetch(url, { credentials:'same-origin', ...opt });
    } catch (e2) {
      throw new Error('无法连接本机服务：请检查 ERP 程序窗口是否还在运行，若已关闭请重新打开程序');
    }
  }
  let j = {}; try { j = await r.json(); } catch { j = {}; }
  if (r.status === 401 && j.code === 'NEED_LOGIN') {
    showLogin('登录已失效，请重新登录');
    throw new Error('NEED_LOGIN');
  }
  if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

// 窄屏自动切换手机布局；/m.html 为强制手机版入口（桌面也可预览）
function applyResponsive(){
  const force = /^\/m(\.html)?$/.test(location.pathname);
  const next = force || window.innerWidth <= 700;
  const prev = document.documentElement.classList.contains('mobile-mode');
  document.documentElement.classList.toggle('mobile-mode', next);
  if(prev !== next){
    if(S.tab === 'jinxiao'){ if(S.data.length) renderJinxiao(S.data); }
    else if(S.columns.length && S.view.length){
      renderBody(S.tab==='stock' ? S.view.slice(0,1000) : S.view, S.columns);
      setStockMode(S.tab==='stock');
    }
  }
}
applyResponsive();
window.addEventListener('resize', applyResponsive);

function today(){ const d=new Date(); return d.toISOString().slice(0,10); }
function monthAgo(){ const d=new Date(); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,10); }
function fmt(v){
  if(v===null||v===undefined||v==='') return '';
  if(typeof v==='number') return v.toLocaleString('zh-CN',{maximumFractionDigits:3});
  return String(v);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function filters(){
  return { start:$('#start').value, end:$('#end').value, q:$('#q').value.trim(),
    cangku:$('#cangku').value.trim(), leixing:$('#leixing').value.trim(), xmmc:$('#xmmc').value.trim() };
}
// 库存数量默认按全部历史累计；流水页签默认近一月；进销动态默认当月。用户手动改过日期后不再自动切换。
function monthStart(){ const d=new Date(); return d.toISOString().slice(0,8)+'01'; }
function syncDefaultDates(){
  if(S.dateTouched) return;
  if(S.tab==='stock'){ $('#start').value=''; $('#end').value=''; }
  else if(S.tab==='jinxiao'){ $('#start').value=monthStart(); $('#end').value=today(); }
  else { $('#start').value=monthAgo(); $('#end').value=today(); }
}
// 切页签后同步筛选区与页签可见性（进销动态只要日期筛选；三端内置服务均已实现该接口）
function applyTabUI(){
  $('#filters').classList.toggle('jx', S.tab==='jinxiao');
  document.querySelector('.wrap').classList.toggle('jxmode', S.tab==='jinxiao');
}
function qs(extra){
  const p = new URLSearchParams({...filters(), ...extra});
  [...p.keys()].forEach(k=>{ if(p.get(k)==='') p.delete(k); });
  return p.toString();
}
function numFields(){ return new Set(['shuliang','zhongliang','shiji_zhongliang','stockQty','kuan','chang','danjia','jine']); }

// ===== 进销动态文字报告：按仓库汇总「入库多少 / 出库多少 / 哪些库没动」，铺开无滚动条 =====
const IS_APP = !!(window.DingCheng || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.dingcheng));
const JX_GROUPS = [
  { name:'ERP标准库',     cols:[['bz_ruku','入库'],['bz_chuku','出库'],['bz_kucun','库存']], wh:1 },
  { name:'BB条',          cols:[['bb_ruku','入库'],['bb_chuku','出库'],['bb_kucun','库存']], wh:1 },
  { name:'EC角铝',        cols:[['ec_ruku','入库'],['ec_chuku','出库'],['ec_kucun','库存']], wh:1 },
  { name:'原材料(型材库)', cols:[['xc_ruku','入库'],['xc_chuku','出库'],['xc_kucun','库存']], wh:1 },
  { name:'改制仓',        cols:[['gz_ruku','入库'],['gz_chuku','出库'],['gz_kucun','库存']], wh:1 },
  { name:'生产车间',      cols:[['sc_ruku','入库'],['sc_wr_chuku','出库·待发货'],['sc_ffl_chuku','出库·废料'],['sc_tbz_chuku','出库·退标准库'],['sc_kucun','库存']], wh:1 },
  { name:'待发货车间存',  cols:[['dfh_ruku','入库'],['dfh_chuku','出库'],['dfh_kucun','库存']], wh:1 },
  { name:'虚拟出入库存',  cols:[['xfh_ruku','入库'],['xfh_chuku','出库'],['xfh_kucun','库存']], wh:1 },
  { name:'项目地出入库',  cols:[['xmc_ruku','入库'],['xmc_chuku','出库'],['xmc_kucun','库存']], wh:1 },
  { name:'临时仓',        cols:[['ls_ruku','入库'],['ls_fj_chuku','出库·分件'],['ls_ffl_chuku','出库·废料'],['ls_kucun','库存']], wh:1 },
  { name:'废料库存',      cols:[['fl_ruku','入库'],['fl_chuku','出库'],['fl_kucun','库存']], wh:1 },
  { name:'置换地库存',    cols:[['zh_ruku','入库'],['zh_chuku','出库'],['zh_kucun','库存']], wh:1 },
  { name:'原材料进',      cols:[['yc_ruku','入库'],['yc_chuku','出库'],['yc_kucun','库存']], wh:1 },
  { name:'销售及其他',    cols:[['xs_kucun','销售'],['ybf_kucun','样板房库存'],['dijin_kucun','抵进材料'],['dichu_kucun','抵出材料']] },
  { name:'进销存核对',    cols:[['temp','进'],['temp','销'],['sum_kucun','总库存'],['sunHao','单重量引起的累积偏差'],['temp','平衡检测'],['temp','备注']] }
];
// 占位/候选字段：厂商后端当前不返回原材料进字段，先做候选兜底，将来加了自动带出
function jxVal(r, f){
  if(f === 'temp') return r.temp;
  let v = r[f];
  if(v === undefined && f.indexOf('yc_') === 0){
    v = r['ycl_' + f.slice(3)];
    if(v === undefined) v = r['ycl' + f.slice(2)];
  }
  return v;
}
// 数值：千分位最多 2 位小数（0 返回空串，仅在需要展示时由调用方过滤）
function jxFmt(v){
  if(v === null || v === undefined || v === '') return '';
  const n = Number(v);
  if(Number.isFinite(n)) return n === 0 ? '' : n.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
  return String(v);
}
function jxNum(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }
// 「2026-11-06」→「2026年11月6日」
function jxDateCN(s){
  const m = String(s || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? `${m[1]}年${+m[2]}月${+m[3]}日` : String(s || '');
}
// shijian 是「2026/11/6」这类不补零格式，字符串排序会错（9月排在11月后），必须按日期数值比
function jxTime(s){
  const m = String(s || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? (+m[1]) * 10000 + (+m[2]) * 100 + (+m[3]) : 0;
}
// 库存/余额性质列取期末值（含「单重量引起的累积偏差」——它是每天的快照，跨天不能累加）；
// 发生额列（入库 / 出库）取范围合计。
// 判定必须看字段名而不是显示名：厂商所有 *_kucun 都是「当天余额快照」，
// 「销售」「样板房库存」「抵进材料」「抵出材料」对应 xs_kucun / ybf_kucun /
// dijin_kucun / dichu_kucun，同样是余额。若按显示名判断（含「库存」二字），
// 「销售」会被当成发生额把每天恒定值累加，导致「销售及其他」被误判成「有出入库」。
function jxIsStockCol(field, name){
  return /_kucun$/.test(field) || field === 'sunHao' || field === 'temp' ||
         name === '单重量引起的累积偏差';
}
function renderJinxiao(rows){
  $('#tableWrap').style.display = 'none'; $('#cardWrap').style.display = 'none';
  $('#jxWrap').classList.add('show');
  if(!rows.length){ $('#jxWrap').innerHTML = ''; $('#empty').style.display = 'block'; return; }
  $('#empty').style.display = 'none';
  // 升序排列，期末值 = 范围内最后一天
  const rs = rows.slice().sort((a, b) => jxTime(a.shijian) - jxTime(b.shijian));
  const last = rs[rs.length - 1];
  const sumCol = (r, c) => rs.reduce((s, x) => s + jxNum(jxVal(x, c[0])), 0);
  const stats = JX_GROUPS.map(g => {
    const items = [], stockTail = []; let active = false;
    g.cols.forEach(c => {
      if(jxIsStockCol(c[0], c[1])){
        const n = jxNum(jxVal(last, c[0]));
        if(n) stockTail.push(`${c[1]} ${jxFmt(n)}`);
      } else {
        const s = sumCol(last, c);
        if(s){ items.push(`${c[1]} ${jxFmt(s)}`); active = true; }
      }
    });
    return { name: g.name, items, stockTail, active, wh: !!g.wh };
  });
  // 统计范围描述（跟筛选框一致；单天只写一天）
  const s = $('#start').value, e = $('#end').value;
  const rangeTxt = s === e ? jxDateCN(s)
    : `${s ? jxDateCN(s) : '最早'} 至 ${e ? jxDateCN(e) : '至今'}`;
  const act = stats.filter(g => g.active), inact = stats.filter(g => !g.active);
  const line = g => {
    const parts = g.items.concat(g.stockTail);
    if(g.active) return `<div class="jx-item"><b>${esc(g.name)}：</b>${esc(parts.join('，'))}</div>`;
    const tail = g.stockTail.length ? `（${esc(g.stockTail.join('，'))}）` : '';
    // 「进销存核对」只有总库存 / 累积偏差两个余额快照，不写「期间无记录」，
    // 整行亮蓝加粗、括号加淡蓝底高亮，便于一眼看到核对结果。
    // 用 inline 样式：桌面 / CF / 安卓 / iOS 各有皮肤副本，避免高亮被各端 CSS 覆盖。
    if(g.name === '进销存核对')
      return `<div class="jx-item" style="color:#1d4ed8;font-weight:600"><b style="color:#1d4ed8">${esc(g.name)}：</b><span style="background:#e8f0ff;border-radius:4px;padding:1px 6px">${tail}</span></div>`;
    // 其它非仓库分组（销售及其他）同样只有余额快照，也不写「期间无记录」
    const verb = g.wh ? '期间无入库、无出库' : '';
    return `<div class="jx-item muted">${esc(g.name)}：${verb}${tail}</div>`;
  };
  $('#jxWrap').innerHTML =
    `<div class="jx-report">` +
    `<div class="jx-range">统计范围：${esc(rangeTxt)}（共 ${rs.length} 天）</div>` +
    (act.length
      ? `<div class="jx-sec">有出入库（${act.length} 个）</div>` + act.map(line).join('')
      : `<div class="jx-item">统计范围内所有仓库均无出入库。</div>`) +
    (inact.length
      ? `<div class="jx-sec">无出入库（${inact.length} 个）</div>` + inact.map(line).join('')
      : '') +
    `</div>`;
}
function renderHead(cols){
  // 库存汇总列宽按百分比（自适应容器，不横滑）；流水页列多，仍用最小宽度 + 横向滚动
  const fixed = S.tab === 'stock';
  $('#thead').innerHTML = '<tr>' + cols.map(c=>{
    const style = fixed ? `width:${c[2]}%` : `min-width:${c[2]}px`;
    return `<th style="${style}">${esc(c[1])}</th>`;
  }).join('') + '</tr>';
}
// 库存汇总：少于阈值高亮；0 及以下（无库存/异常）用更醒目的红色
// 阈值改动时请同步页脚「只看低库存 <50」与图例「库存 1–49」文案
const LOW_STOCK = 50;
function lowLevel(q){
  if(!Number.isFinite(q)) return 0;
  if(q <= 0) return 2;
  if(q < LOW_STOCK) return 1;
  return 0;
}
function renderBody(rows, cols){
  const mobile = document.documentElement.classList.contains('mobile-mode');
  if(mobile){
    const flow = S.tab==='ruku' || S.tab==='chuku';
    const qtyKey = S.tab==='stock' ? 'stockQty' : 'shuliang';
    const skip = new Set(['spec','stockQty','shuliang','shiji_zhongliang']);
    // 出入库手机卡片：固定显示用户指定的九项（顶部规格 + 八项明细），不再按「前 5 个非空字段」截断；空值也保留占位
    const flowFields = [
      [S.tab==='chuku' ? 'chukushijian' : 'rukushijian', S.tab==='chuku' ? '出库时间' : '入库时间', ''],
      ['daima', '编码', ''],
      ['cangku', '仓库', ''],
      ['shuliang', '数量', 'mq'],
      ['shiji_zhongliang', '实际重量', 'mq'],
      ['crkxmmc', '项目', ''],
      ['laiyuan_telephone', '来源', 'mq'],
      ['beizhu', '备注', '']
    ];
    const cell = v => (v===undefined || v===null || v==='') ? '—' : esc(fmt(v));
    // 型材库：规格位改显示「名称」（服务端 spec 是 C槽 / 字母编码 / 宽×长规则算出来的，对型材库没意义）。
    // 名称为空时回退原规格，避免显示「—」丢信息。仅手机端出入库卡片生效；桌面表格、库存汇总、进销动态不变。
    const specText = r => String(r.leixing || '').includes('型材库')
      ? (r.mingcheng || r.spec) : r.spec;
    $('#cardWrap').innerHTML = rows.map(r=>{
      const lv = S.tab==='stock' ? lowLevel(Number(r.stockQty)) : 0;
      const cls = lv===2 ? ' emptyq' : lv===1 ? ' low' : '';
      const title = String(r.spec || r.mingcheng || r.daima || r.rukushijian ||
        r.chukushijian || '—');
      let top, meta;
      if(flow){
        top = `<div class="spec"><span class="slabel">规格</span>${cell(specText(r))}</div>`;
        meta = flowFields.map(([k, label, style])=>
          `<span${style?' class="'+style+'"':''}><b>${esc(label)}：</b>${cell(r[k])}</span>`).join('');
      } else {
        top = `<div class="spec">${esc(title)}</div>`;
        const qty = r[qtyKey]!==undefined
          ? `<span class="mq"><b>${S.tab==='stock'?'库存数量':'数量'}：</b>${esc(fmt(r[qtyKey]))}</span>` : '';
        // 出入库卡片：实际重量与数量并列高亮显示（此前排在第 8 列被截掉）
        const w = S.tab!=='stock' && r.shiji_zhongliang!==undefined && r.shiji_zhongliang!=='' && r.shiji_zhongliang!=null
          ? `<span class="mq"><b>实际重量：</b>${esc(fmt(r.shiji_zhongliang))}</span>` : '';
        // 来源强制显示（用户要求各端可见，不参与前 5 名额竞争）
        const src = S.tab!=='stock' && r.laiyuan_telephone!==undefined && r.laiyuan_telephone!=='' && r.laiyuan_telephone!=null
          ? `<span class="mq"><b>来源：</b>${esc(fmt(r.laiyuan_telephone))}</span>` : '';
        meta = qty + w + src + cols.filter(c=>!skip.has(c[0]) && r[c[0]]!=='' && r[c[0]]!=null)
          .slice(0,5)
          .map(c=>`<span><b>${esc(c[1])}：</b>${esc(fmt(r[c[0]]))}</span>`).join('');
      }
      return `<div class="mcard${cls}${flow?' flow':''}"><div class="top">${top}</div><div class="meta">${meta}</div></div>`;
    }).join('');
    $('#tbody').innerHTML = '';
  } else {
    const N = numFields();
    $('#tbody').innerHTML = rows.map(r=>{
      const lv = S.tab==='stock' ? lowLevel(Number(r.stockQty)) : 0;
      const tr = lv===2 ? ' class="stock-empty"' : lv===1 ? ' class="stock-low"' : '';
      return '<tr'+tr+'>' + cols.map(c=>{
        const v = r[c[0]];
        let cls = N.has(c[0]) ? 'num' + (typeof v==='number' && v<0 ? ' neg':'') : '';
        if(c[0]==='stockQty' && lv===1) cls += ' stock-qty-low';
        if(c[0]==='stockQty' && lv===2) cls += ' stock-qty-empty';
        const text = fmt(v);
        return `<td${cls?' class="'+cls+'"':''} data-key="${esc(c[0])}" title="${esc(text)}">${esc(text)}</td>`;
      }).join('') + '</tr>';
    }).join('');
    $('#cardWrap').innerHTML = '';
  }
  $('#empty').style.display = rows.length ? 'none' : 'block';
}
function renderStats(items){
  $('#stats').innerHTML = items.map(i=>`<div class="card stat"><div class="k">${esc(i[0])}</div><div class="v">${esc(i[1])}</div></div>`).join('');
}
function showNote(on){ $('#note').classList.toggle('show', !!on); }
// 库存汇总不使用分页，页脚换成低库存筛选与图例；进销动态同样不分页
function setStockMode(on){
  document.querySelector('.wrap').classList.toggle('compact', on);
  $('#lowWrap').style.display = on ? 'flex' : 'none';
  $('#legend').style.display = on ? 'flex' : 'none';
  const noPage = on || S.tab === 'jinxiao';
  ['pageSize','prev','next'].forEach(id=>$('#'+id).style.display = noPage ? 'none' : '');
}

// 查询进行中：按钮置灰 +「查询中…」（本机数据正在下载/更新时显示「更新中…」）
function setBusyUI(b, mode){
  const bs = $('#btnSearch');
  if(b){ S._btnText = bs.textContent; bs.textContent = mode || '查询中…'; bs.disabled = true;
         $('#prev').disabled = $('#next').disabled = true; }
  else { bs.textContent = S._btnText || '查 询'; bs.disabled = false;
         if(S.tab !== 'stock'){
           const pages = Math.max(1, Math.ceil(S.total/S.rows));
           $('#prev').disabled = S.page <= 1;
           $('#next').disabled = S.page >= pages;
         } else { $('#prev').disabled = $('#next').disabled = true; }
  }
}
// 页脚同步状态：数据更新时间 + 新增记录提示（不弹窗）
function updateSyncInfo(info){
  const el = $('#syncInfo'); if(!el) return;
  const t = info && info.syncedAt;
  if(!t){ el.textContent=''; return; }
  const d = new Date(t);
  const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
  const n = info.lastNew;
  el.textContent = (n > 0 ? `已同步 ${n} 条新记录 · ` : '') + `数据更新于 ${hh}:${mm}`;
}

async function load(){
  if(S.busy) return;
  S.busy = true; setStockMode(S.tab==='stock'); $('#tablebox').classList.add('loading');
  applyTabUI();
  // 恢复三个渲染容器的默认可见性（手机端卡片由 mobile-mode CSS 接管），进销动态分支再单独切换
  $('#tableWrap').style.display = ''; $('#cardWrap').style.display = '';
  $('#jxWrap').classList.remove('show');
  // 先刷新一次同步状态（本机请求，毫秒级）：后台正在首次下载/更新数据时，按钮显示「更新中…」
  try{
    const m = await api('/api/meta'); S.meta = m;
    if(m.syncedAt) S._lastSync = { syncedAt:m.syncedAt, lastNew:m.lastNew||0 };
  }catch(e2){}
  const syncing = S.meta && S.meta.syncing && !S.meta.dataReady;
  setBusyUI(true, syncing ? '更新中…' : '查询中…');
  if(syncing) showNote(true), $('#note').textContent = '本机数据正在下载/更新中，本次查询走厂商云会稍慢；更新完成后查询将全部走本机数据（毫秒级）。';
  $('#empty').style.display='none';
  try{
    if(S.tab==='jinxiao'){
      const p = new URLSearchParams({ start:$('#start').value, end:$('#end').value });
      [...p.keys()].forEach(k=>{ if(!p.get(k)) p.delete(k); });
      const j = await api('/api/jinxiao?'+p.toString());
      S.data = j.rows || []; S.total = j.total || S.data.length; S.view = S.data;
      renderJinxiao(S.data);
      const last = S.data[0] || {};
      renderStats([['记录(天)',fmt(S.total)],['最新总库存',fmt(jxFmt(last.sum_kucun))],['最新累积偏差',fmt(jxFmt(last.sunHao))]]);
      const range = ($('#start').value || '最早') + ' ~ ' + ($('#end').value || '至今');
      showNote(true);
      $('#note').textContent = `进销动态 ${range}：文字汇总各仓库入库 / 出库金额与库存，实时取自厂商云（60 秒内重复查询走缓存）。入库、出库为范围内合计，库存取最后一天的数值；「无出入库」表示该仓库范围内没有发生额。查全部历史请点【全部时间】。`;
      $('#pageInfo').textContent = `共 ${fmt(S.total)} 天记录`;
      $('#prev').disabled = $('#next').disabled = true;
    } else if(S.tab==='stock'){
      const j = await api('/api/stock?'+qs({}));
      if(j.syncedAt) S._lastSync = { syncedAt: j.syncedAt, lastNew: (S.meta&&S.meta.lastNew)||0 };
      S.columns = j.columns; S.data = j.rows; S.total = j.total;
      const low = S.data.filter(r=>lowLevel(Number(r.stockQty))>0);
      S.view = $('#onlyLow').checked ? low : S.data;
      renderHead(S.columns); renderBody(S.view.slice(0,1000), S.columns);
      const sum = k => S.data.reduce((a,r)=>a+(Number(r[k])||0),0);
      const specs = new Set(S.data.map(r=>r.spec).filter(Boolean)).size;
      const whs = new Set(S.data.map(r=>r.cangku).filter(Boolean)).size;
      renderStats([['物料条目',fmt(S.data.length)],['库存总数量',fmt(sum('stockQty'))],
        ['低库存 <'+LOW_STOCK,fmt(low.length)],['不同规格',fmt(specs)],['涉及仓库',fmt(whs)]]);
      showNote(true);
      const range = ($('#start').value || '最早') + ' ~ ' + ($('#end').value || '至今');
      $('#note').textContent = `统计区间 ${range}：库存数量 = 该区间内入库 − 出库（默认全部历史），按「编码+名称+规格+类型+仓库」分行，顶部「库存总数量」为合计；已扫描入库 ${fmt(j.scanned.ruku)} 条、出库 ${fmt(j.scanned.chuku)} 条` +
        (j.truncated ? `（服务端共 ${fmt(j.available.ruku)} / ${fmt(j.available.chuku)} 条，已按上限截断，请输入规格或缩小范围）` : '（已覆盖全部记录）') +
        '。查全部历史请点【全部时间】；此为收发累计差，非官方实时账面数，精确值请用右上角官方页面。ERP 规格存在「宽/长」两个独立字段，搜 400X2600 或 2600 均可。';
      $('#pageInfo').textContent = `共 ${fmt(S.view.length)} 个物料条目` + (S.view.length>1000 ? '（表格仅显示前 1000 条，导出 CSV 可获取全部）':'');
      $('#prev').disabled = $('#next').disabled = true;
    } else {
      const j = await api('/api/query?'+qs({type:S.tab,page:S.page,rows:S.rows}));
      if(j.syncedAt) S._lastSync = { syncedAt: j.syncedAt, lastNew: (S.meta&&S.meta.lastNew)||0 };
      S.columns = j.columns; S.data = j.rows; S.total = j.total; S.view = S.data;
      renderHead(S.columns); renderBody(S.data, S.columns);
      const sum = k => S.data.reduce((a,r)=>a+(Number(r[k])||0),0);
      const label = S.tab==='ruku' ? '本页入库数量' : S.tab==='chuku' ? '本页出库数量' : '本页数量';
      renderStats([['符合条件记录',fmt(S.total)],[label,fmt(Math.abs(sum('shuliang')))],
        ['本页实际重量',fmt(sum('shiji_zhongliang'))]]);
      showNote(false);
      const pages = Math.max(1, Math.ceil(S.total/S.rows));
      $('#pageInfo').textContent = `第 ${S.page} / ${fmt(pages)} 页 · 共 ${fmt(S.total)} 条`;
      $('#prev').disabled = S.page<=1; $('#next').disabled = S.page>=pages;
    }
  }catch(e){
    if(e.message === 'NEED_LOGIN') return;   // api() 已重新弹出登录框
    showNote(true); $('#note').textContent='查询失败：'+e.message;
    $('#tbody').innerHTML=''; $('#empty').style.display='block'; $('#empty').textContent='查询失败：'+e.message;
  }finally{
    S.busy=false; $('#tablebox').classList.remove('loading'); setBusyUI(false);
    updateSyncInfo(S._lastSync || (S.meta && S.meta.dataReady ? S.meta : null));
  }
}

async function exportCsv(){
  try{
    let cols=S.columns, rows=(S.tab==='stock' ? S.view : S.data);
    if(S.tab==='jinxiao'){
      // 全部列（含占位列）按分段顺序导出，一行一天
      cols = [['shijian','时间'],
        ...JX_GROUPS.flatMap(g=>g.cols.map(c=>[c[0], g.name+'·'+c[1]]))];
      rows = S.data;
    } else if(S.tab!=='stock'){
      const max = (S.meta&&S.meta.exportMaxRows)||5000;
      const j = await api('/api/query?'+qs({type:S.tab,page:1,rows:Math.min(max,S.total||max)}));
      rows = j.rows||[]; cols = j.columns||cols;
    }
    if(!rows.length){ alert('没有可导出的记录'); return; }
    const cell = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const csv = '\uFEFF' + [cols.map(c=>cell(c[1])).join(','), ...rows.map(r=>cols.map(c=>cell(r[c[0]])).join(','))].join('\r\n');
    const name = `${S.tab}_${today()}.csv`;
    // Android WebView 无法处理 blob: 下载，交给 App 写入系统「下载」目录
    if(window.DingCheng && window.DingCheng.saveCsv){
      window.DingCheng.saveCsv(btoa(unescape(encodeURIComponent(csv))), name);
      return;
    }
    // iOS WKWebView 同样无法处理 blob: 下载，交给 App 写出并弹出分享面板
    if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.dingcheng){
      window.webkit.messageHandlers.dingcheng.postMessage({
        type:'saveCsv', base64:btoa(unescape(encodeURIComponent(csv))), name
      });
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download = name; a.click(); URL.revokeObjectURL(a.href);
  }catch(e){ if(e.message!=='NEED_LOGIN') alert('导出失败：'+e.message); }
}

// ===== 登录 / 退出 =====
// 微信 / X5 内核的第三方中文输入法（搜狗、百度、讯飞等）在组字、按回车选词时，
// 常常不给 isComposing、只给 keyCode=229。旧逻辑在登录遮罩上无条件拦截 Enter 并
// preventDefault()，会把「选词上屏」吞掉、还顺手提交登录，表现就是中文输入法用不了。
let dcComposing = false, dcComposeEndAt = 0, dcLoginBusy = false;
// 密码遮蔽兜底：极老内核不认 -webkit-text-security 时切回原生密码框，避免明文显示。
// 微信 X5 / WKWebView / Blink 都支持该属性，微信里仍保持普通文本框。
(function(){
  const p = document.getElementById('loginPass'); if(!p) return;
  const s = p.style;
  const ok = ('webkitTextSecurity' in s) ||
             (window.CSS && CSS.supports && CSS.supports('-webkit-text-security','disc'));
  if(!ok) p.type = 'password';
})();
// 不用 <label> 包复选框：部分安卓 WebView 对嵌套 label 的点击转发不可靠。
// 整行点击显式切换；点方框本身交给原生控件，避免切换两次。
(function(){
  const c = document.getElementById('rememberChk'), row = document.getElementById('rememberRow');
  if(!c || !row) return;
  row.addEventListener('click', e=>{
    if(e.target === c) return;
    c.checked = !c.checked;
    c.dispatchEvent(new Event('change', { bubbles:true }));
  });
})();
['loginUser','loginPass','q'].forEach(id=>{
  const el = document.getElementById(id); if(!el) return;
  el.addEventListener('compositionstart', ()=>{ dcComposing = true; });
  el.addEventListener('compositionupdate', ()=>{ dcComposing = true; });
  el.addEventListener('compositionend',   ()=>{ dcComposing = false; dcComposeEndAt = Date.now(); });
});
// 「记住密码」：凭据 base64 混淆后存本机 localStorage，只用于下次自动登录；退出登录即清除
const LS_KEY = 'dc_saved_login', RM_KEY = 'dc_remember';
function saveLogin(u, p){ try{ localStorage.setItem(LS_KEY, btoa(unescape(encodeURIComponent(JSON.stringify({u, p}))))); }catch(e){} }
function loadLogin(){ try{ const s = localStorage.getItem(LS_KEY); if(!s) return null; const o = JSON.parse(decodeURIComponent(escape(atob(s)))); return (o && o.u && o.p) ? o : null; }catch(e){ return null; } }
function clearLogin(){ try{ localStorage.removeItem(LS_KEY); }catch(e){} }
function loadRemember(){ try{ const v = localStorage.getItem(RM_KEY); return v === null ? true : v === '1'; }catch(e){ return true; } }
function saveRemember(v){ try{ localStorage.setItem(RM_KEY, v ? '1' : '0'); }catch(e){} }
$('#rememberChk').addEventListener('change', e=>saveRemember(e.target.checked));
function showLogin(msg){
  $('#loginOverlay').hidden = false;
  document.querySelector('.wrap').style.visibility = 'hidden';  // 未登录不露出空白查询页
  const err = $('#loginErr');
  err.textContent = msg || ''; err.hidden = !msg;
  $('#btnLogout').hidden = true;
  $('#loginMsg').textContent = '未登录';
  $('#dot').className = 'dot err';
  $('#company').textContent = S.meta ? S.meta.company : '江西鼎城铝模科技有限公司';
  $('#tbody').innerHTML = ''; $('#cardWrap').innerHTML = '';
  $('#empty').style.display = 'none'; $('#stats').innerHTML = '';
  showNote(false);
  const remembered = loadRemember();
  $('#rememberChk').checked = remembered;
  if(!remembered) clearLogin();
  const saved = remembered ? loadLogin() : null;
  if(saved){ $('#loginUser').value = saved.u; $('#loginPass').value = saved.p; }
  else { $('#loginUser').value = ''; $('#loginPass').value = ''; }
  // 微信内置浏览器里 JS 抢占焦点会让第三方输入法初始化异常（候选词上不了屏），
  // 微信中不自动聚焦，改由用户主动点输入框；其它环境保留自动聚焦。
  if(!/MicroMessenger/i.test(navigator.userAgent)) setTimeout(()=>$('#loginUser').focus(), 0);
}
function hideLogin(user){
  $('#loginOverlay').hidden = true;
  document.querySelector('.wrap').style.visibility = '';
  $('#btnLogout').hidden = false;
  $('#company').textContent = (S.meta ? S.meta.company : '江西鼎城铝模科技有限公司') + ' · ' + user;
  $('#loginMsg').textContent = '已连接 ERP';
  $('#dot').className = 'dot ok';
}
async function submitLogin(){
  if(dcLoginBusy || dcComposing) return;   // 中文组字未上屏不提交；同时防回车连击重复登录
  const name = $('#loginUser').value.trim();
  const pass = $('#loginPass').value;
  const err = $('#loginErr');
  if(!name || !pass){ err.textContent='请填写账号和密码'; err.hidden=false; return; }
  const btn = $('#btnLogin');
  dcLoginBusy = true;
  btn.disabled = true; btn.textContent = '登录中…'; err.hidden = true;
  try{
    const r = await fetch('/api/login', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ user:name, password:pass })
    });
    let j = {}; try { j = await r.json(); } catch { j = {}; }
    if(!r.ok) throw new Error(j.error || '登录失败');
    const remember = $('#rememberChk').checked;
    saveRemember(remember);
    if(remember) saveLogin(name, pass); else clearLogin();
    $('#loginPass').value = '';
    S.meta = await api('/api/meta');
    hideLogin(j.user || name);
    S.page = 1; S.dateTouched = false; syncDefaultDates(); showPendingHint();
  }catch(e){
    err.textContent = e.message || '登录失败'; err.hidden = false;
  }finally{ dcLoginBusy = false; btn.disabled = false; btn.textContent = '登 录'; }
}
$('#btnLogin').onclick = submitLogin;
// 回车提交必须让位于输入法：组字 / 选词期间的 Enter 一律放行给输入法处理
$('#loginOverlay').addEventListener('keydown', e=>{
  if(e.key !== 'Enter' && e.keyCode !== 13) return;
  if(dcComposing || e.isComposing || e.keyCode === 229 || (Date.now() - dcComposeEndAt) < 150) return;
  e.preventDefault();
  submitLogin();
});
$('#btnLogout').onclick = async ()=>{
  await fetch('/api/logout', { method:'POST', credentials:'same-origin' }).catch(()=>{});
  clearLogin();
  $('#loginUser').value = ''; $('#loginPass').value = '';
  showLogin('已退出登录');
};

(async()=>{
  try{
    S.meta = await api('/api/meta');
    const typeSel = $('#leixing');
    const used = new Set(S.meta.typeOptionsWithData || []);
    const gUsed = document.createElement('optgroup'); gUsed.label = '贵司有记录';
    const gRest = document.createElement('optgroup'); gRest.label = '其他类型';
    (S.meta.typeOptions || []).forEach(v => {
      const o = document.createElement('option'); o.value = v; o.textContent = v;
      (used.has(v) ? gUsed : gRest).appendChild(o);
    });
    typeSel.appendChild(gUsed); typeSel.appendChild(gRest);
    $('#official').href = S.meta.officialStockUrl;
    $('#loginCompany').textContent = S.meta.company;
    const t = new URLSearchParams(location.search).get('tab');
    if(t && ['ruku','chuku','stock','jinxiao'].includes(t)){
      S.tab = t;
      document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.t===t));
    }
    applyTabUI();
    syncDefaultDates();
    if(S.meta.dataReady && S.meta.syncedAt) S._lastSync = { syncedAt: S.meta.syncedAt, lastNew: S.meta.lastNew||0 };
    updateSyncInfo(S._lastSync);
    // 已登录直接进入；未登录则用本机记住的账号密码自动登录，失败才弹登录框
    if(S.meta.loggedIn && S.meta.user){ hideLogin(S.meta.user); showPendingHint(); }
    else {
      const saved = loadRemember() ? loadLogin() : null;
      if(saved && saved.u && saved.p){
        try{
          const r = await fetch('/api/login', {
            method:'POST', credentials:'same-origin',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ user:saved.u, password:saved.p })
          });
          if(r.ok){
            S.meta = await api('/api/meta');
            hideLogin(S.meta.user || saved.u); showPendingHint();
          } else { showLogin(''); }
        }catch(e2){ showLogin(''); }
      } else { showLogin(''); }
    }
  }catch(e){
    $('#loginMsg').textContent = '服务未启动';
    $('#loginCompany').textContent = '江西鼎城铝模科技有限公司';
    showLogin('无法连接本地服务，请确认已运行 start.bat');
  }
})();

// Service Worker 仅在安全上下文可用（localhost / https）；局域网 http 下自动跳过，
// 手机端仍可通过浏览器「添加到主屏幕」获得全屏图标。
/* 桌面版不注册 Service Worker：页面随程序更新，不使用离线缓存 */</script>
<script>
/* 桌面版外壳交互：只负责标题栏按钮、状态显示，不触碰任何查询/登录逻辑 */
(function () {
  var D = window.dcDesktop;
  if (!D) return;
  var $ = function (id) { return document.getElementById(id); };

  // macOS 用系统红黄绿交通灯，标题栏左侧留白并隐藏自绘窗口按钮
  if (D.isMac) document.documentElement.classList.add('is-mac');

  // 桌面版不需要 PWA 离线缓存，避免旧页面被 Service Worker 锁住
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
  } catch (e) {}

  $('dcMinBtn').onclick = function () { D.minimize(); };
  $('dcMaxBtn').onclick = function () { D.toggleMax(); };
  $('dcCloseBtn').onclick = function () { D.close(); };
  $('dcMenuBtn').onclick = function () { D.menu(); };
  $('dcDrag').ondblclick = function () { D.toggleMax(); };

  function paintMax(on) {
    var b = $('dcMaxBtn'), r = $('dcMaxRect');
    b.title = on ? '还原' : '最大化';
    if (r) {
      r.setAttribute('x', on ? '4.5' : '3.5'); r.setAttribute('y', on ? '2.5' : '3.5');
      r.setAttribute('width', on ? '8' : '9'); r.setAttribute('height', on ? '8' : '9');
    }
  }
  D.onMaxChanged(paintMax);

  // 四个页签上半部分压紧后，表格区高度由 shell.css 统一计算。
  // 说明条固定为两行（47px + 8px 下边距），四个页签统一预留 55px：
  // 入库 / 出库 / 库存三个表格页因此完全等高，比例一致，窗口变窄也不会撑高上半部分。
  (function () {
    var note = $('note');
    if (!note) return;
    document.documentElement.style.setProperty('--dc-note-slot', '55px');
    // 说明条被压到两行时点一下展开全文（网页端只在手机模式下展开）
    note.addEventListener('click', function () {
      if (!document.documentElement.classList.contains('mobile-mode')) note.classList.toggle('open');
    });
  })();

  // 菜单「重新登录」：清会话与本机凭据，回到登录框
  D.onRelogin(function () {
    fetch('/api/logout', { method: 'POST', credentials: 'same-origin' })
      .catch(function () {})
      .then(function () {
        try { localStorage.removeItem('dc_saved_login'); } catch (e) {}
        location.reload();
      });
  });

  D.info().then(function (info) {
    if (!info) return;
    $('dcPort').textContent = info.port || '—';
    $('dcVer').textContent = info.version || '—';
  }).catch(function () {});

  function hhmm(ts) {
    var n = Number(ts) || 0;
    if (!n) return '';
    if (n < 1e11) n *= 1000;
    try { return new Date(n).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return ''; }
  }

  var refreshTimer = null;
  function schedule(ms) {
    if (refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = setTimeout(refresh, ms);
  }
  function num(n) {
    try { return Number(n || 0).toLocaleString('zh-CN'); } catch (e) { return String(n || 0); }
  }

  function refresh() {
    fetch('/api/meta', { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var status = $('dcStatusText'), sync = $('dcSync');
        if (j.syncing) {
          // 首次登录后要下载一次完整数据：把真实云端页数/条数显示出来，不再静默
          status.textContent = j.firstSync ? '首次下载数据…' : '后台同步中…';
          sync.textContent = j.syncPages
            ? ((j.firstSync ? '正在下载完整数据 · 云端 ' : '正在比对厂商云 · ') +
                num(j.syncPages) + ' 页 / ' + num(j.syncRows) + ' 条')
            : (j.firstSync ? '正在连接厂商云，准备下载完整数据…' : '正在比对厂商云增量数据…');
          sync.classList.add('busy');
          schedule(1000);
        } else {
          status.textContent = j.loggedIn ? '服务就绪 · 已登录' : '服务就绪 · 待登录';
          var t = hhmm(j.syncedAt);
          sync.textContent = j.dataReady
            ? ('本地完整数据已就绪 · ' + num(j.syncLocal) + ' 条' + (t ? ' · 最近同步 ' + t : ''))
            : '等待登录并下载完整数据…';
          sync.classList.remove('busy');
          schedule(10000);
        }
      })
      .catch(function () {
        $('dcStatusText').textContent = '服务连接中…';
        $('dcSync').textContent = '正在连接本地服务…';
        schedule(3000);
      });
  }
  refresh();
  // 登录/退出时遮罩的 hidden 会变化，立即刷新状态，不等下一轮轮询
  try {
    var ov = $('loginOverlay');
    if (ov && window.MutationObserver) {
      new MutationObserver(function () { refresh(); })
        .observe(ov, { attributes: true, attributeFilter: ['hidden'] });
    }
  } catch (e) {}
})();

</script>
