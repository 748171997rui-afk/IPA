name: Build Unsigned IPA

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (16.3+ required for project format)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Normalize layout (find project.yml anywhere)
        run: |
          if [ ! -f project.yml ]; then
            sub=$(find . -maxdepth 4 -name project.yml -not -path "./.git/*" | head -1)
            if [ -n "$sub" ]; then
              sub_dir=$(dirname "$sub")
              echo "Found project.yml in $sub_dir, copying to repo root"
              cp -R "$sub_dir"/. .
            fi
          fi
          if [ ! -f project.yml ]; then
            echo "::error::仓库里找不到 project.yml，请确认已上传 TVBoxIOS 的全部内容（project.yml、TVBox/ 文件夹等）"
            find . -maxdepth 3 -not -path "./.git*" | head -50
            exit 1
          fi
          ls -la

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild \
            -project TVBox.xcodeproj \
            -scheme TVBox \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TVBox.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES | tee build.log

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/TVBox.xcarchive/Products/Applications/TVBox.app" build/Payload/
          cd build
          zip -qry TVBox-unsigned.ipa Payload
          ls -lh TVBox-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-unsigned-ipa
          path: build/TVBox-unsigned.ipa
          retention-days: 30
